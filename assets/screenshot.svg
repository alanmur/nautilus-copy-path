<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" style="background:#1e1e1e; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="760" height="380" fill="#18181b"/>

  <g transform="translate(40, 40)">
    <rect width="680" height="300" rx="12" fill="#242427" stroke="#323238" stroke-width="1"/>
    <rect width="680" height="42" rx="12" fill="#2a2a2f"/>
    <circle cx="22" cy="21" r="6" fill="#ef4444"/>
    <circle cx="40" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="58" cy="21" r="6" fill="#10b981"/>
    <text x="340" y="26" text-anchor="middle" fill="#a1a1aa" font-size="12" font-weight="500">Files — Projects</text>

    <text x="32" y="80" fill="#e4e4e7" font-size="13">main.py</text>
    <text x="32" y="110" fill="#71717a" font-size="13">README.md</text>
    <text x="32" y="140" fill="#71717a" font-size="13">config.json</text>
  </g>

  <g transform="translate(100, 105)" filter="url(#shadow)">
    <rect width="210" height="154" rx="8" fill="#2d2d31" stroke="#3f3f46" stroke-width="1"/>

    <text x="18" y="28" fill="#a1a1aa" font-size="13">Open</text>
    <text x="18" y="56" fill="#a1a1aa" font-size="13">Cut</text>
    <text x="18" y="84" fill="#a1a1aa" font-size="13">Copy</text>
    <line x1="8" y1="96" x2="202" y2="96" stroke="#3f3f46" stroke-width="1"/>

    <rect x="6" y="102" width="198" height="24" rx="5" fill="#3b82f6" fill-opacity="0.15"/>
    <text x="18" y="118" fill="#60a5fa" font-size="13" font-weight="600">Copy Path</text>

    <text x="18" y="142" fill="#e4e4e7" font-size="13">Copy as...</text>
    <text x="188" y="142" fill="#a1a1aa" font-size="12" text-anchor="end">▶</text>
  </g>

  <g transform="translate(315, 125)" filter="url(#shadow)">
    <rect width="230" height="206" rx="8" fill="#2d2d31" stroke="#3f3f46" stroke-width="1"/>

    <text x="18" y="26" fill="#e4e4e7" font-size="13">Absolute Path</text>
    <text x="18" y="52" fill="#e4e4e7" font-size="13">Home Path (~)</text>
    <text x="18" y="78" fill="#60a5fa" font-size="13">Git Relative Path</text>
    <text x="18" y="104" fill="#e4e4e7" font-size="13">Shell Quoted</text>
    <text x="18" y="130" fill="#e4e4e7" font-size="13">Name Only</text>
    <text x="18" y="156" fill="#e4e4e7" font-size="13">File URI</text>
    <text x="18" y="182" fill="#e4e4e7" font-size="13">Markdown Link</text>
  </g>

  <g transform="translate(460, 56)" filter="url(#shadow)">
    <rect width="240" height="42" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <circle cx="20" cy="21" r="5" fill="#3b82f6"/>
    <text x="34" y="20" fill="#f4f4f5" font-size="11" font-weight="600">Path copied</text>
    <text x="34" y="32" fill="#a1a1aa" font-size="10">src/main.py</text>
  </g>
</svg>
